name: بناء تطبيق زاد القلوب

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: فك ضغط مشروع Android
        run: |
          mkdir -p android-project
          unzip -q "ZadAlQolob_Android_Project.zip" -d android-project

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء التطبيق
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi
          echo "مجلد المشروع: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: Zad-Alqolob-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
